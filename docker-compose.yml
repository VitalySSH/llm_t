services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth:
    build: ./auth_service
    env_file: ./auth_service/.env
    ports:
      - "8000:8000"

  bot-api:
    build: ./bot_service
    env_file: ./bot_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - redis

  bot-worker:
    build: ./bot_service
    env_file: ./bot_service/.env
    command: >
      uv run celery -A app.infra.celery_app:celery_app
      worker --loglevel=info
    depends_on:
      - rabbitmq
      - redis

  bot-polling:
    build: ./bot_service
    env_file: ./bot_service/.env
    command: uv run python -m app.bot.runner
    depends_on:
      - redis
      - bot-worker
